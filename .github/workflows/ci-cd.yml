name: SkillHub CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - integration
  pull_request:
    branches:
      - main
      - integration

jobs:
  build-and-test:
    name: Build y Test - SkillHub
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install django python-dotenv

      - name: Verificar estructura del proyecto
        run: |
          echo "Verificando estructura de SkillHub..."
          ls -la
          python -c "import django; print('Django version:', django.__version__)"

      - name: Verificar sintaxis del código Python
        run: |
          python -m py_compile usuarios/models.py
          python -m py_compile usuarios/views.py
          python -m py_compile habilidades/models.py
          python -m py_compile habilidades/views.py
          echo "Sintaxis verificada correctamente"

      - name: Notificación de éxito
        run: |
          echo "Pipeline ejecutado exitosamente para SkillHub"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
