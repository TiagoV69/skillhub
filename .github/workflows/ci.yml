name: SkillHub CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: skillhub
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: skillhub-ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: skillhub
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      AUTH0_DOMAIN: skillhub-dev.auth0.com
      AUTH0_CLIENT_ID: ci-client-id
      AUTH0_CLIENT_SECRET: ci-client-secret
      KAFKA_PRODUCER_ENABLED: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Django configuration
        run: python manage.py check

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run automated tests
        run: python manage.py test --verbosity 2

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-staticfiles
          path: staticfiles/

  deploy-package:
    name: Deploy package
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download static files artifact
        uses: actions/download-artifact@v4
        with:
          name: skillhub-staticfiles
          path: deployment/staticfiles

      - name: Prepare deployment package
        run: |
          mkdir -p deployment/app
          rsync -av \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".scannerwork" \
            --exclude "venv" \
            --exclude "__pycache__" \
            --exclude "staticfiles" \
            ./ deployment/app/
          cat > deployment/DEPLOYMENT_INFO.txt <<EOF
          Project: SkillHub
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Deployment type: packaged release artifact
          EOF
          cd deployment
          zip -r skillhub-deploy-package.zip app staticfiles DEPLOYMENT_INFO.txt

      - name: Upload deploy package
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-deploy-package
          path: deployment/skillhub-deploy-package.zip
